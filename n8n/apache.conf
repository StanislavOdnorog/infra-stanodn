<VirtualHost *:80>
    ServerName n8n.stanodn.org
    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://n8n.stanodn.org%{REQUEST_URI} [R=301,L]
</VirtualHost>
<VirtualHost *:443>
    ServerName n8n.stanodn.org
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/n8n.stanodn.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/n8n.stanodn.org/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # mod_proxy adds the original Host itself; setting it here duplicates it.
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-For
    ProxyPass / http://127.0.0.1:5678/ upgrade=websocket timeout=300
    ProxyPassReverse / http://127.0.0.1:5678/
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog ${APACHE_LOG_DIR}/n8n-error.log
    CustomLog ${APACHE_LOG_DIR}/n8n-access.log combined
</VirtualHost>
