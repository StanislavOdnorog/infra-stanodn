---
- name: Install WireGuard and DNS packages
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
      - dnsmasq
      - dnsutils
    state: present
    update_cache: true

- name: Ensure WireGuard directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(item.owner | default('root')) }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/wireguard, mode: "0700" }
    - { path: "{{ wireguard_client_config_dir }}", owner: "belle", mode: "0700" }

- name: Enable IP forwarding for WireGuard routing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-wireguard-forwarding.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  notify: Reload sysctl

- name: Generate WireGuard server private key
  ansible.builtin.shell: |
    umask 077
    wg genkey > "{{ wireguard_server_private_key_path }}"
  args:
    creates: "{{ wireguard_server_private_key_path }}"
    executable: /bin/bash

- name: Generate WireGuard server public key
  ansible.builtin.shell: |
    wg pubkey < "{{ wireguard_server_private_key_path }}" > "{{ wireguard_server_public_key_path }}"
  args:
    creates: "{{ wireguard_server_public_key_path }}"
    executable: /bin/bash

- name: Ensure WireGuard key permissions are strict
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ wireguard_server_private_key_path }}", mode: "0600" }
    - { path: "{{ wireguard_server_public_key_path }}", mode: "0644" }

- name: Read WireGuard server private key
  ansible.builtin.slurp:
    src: "{{ wireguard_server_private_key_path }}"
  register: wireguard_server_private_key_raw

- name: Render WireGuard server configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  vars:
    wireguard_server_private_key: "{{ wireguard_server_private_key_raw.content | b64decode | trim }}"
  notify: Restart wireguard

- name: Allow WireGuard UDP port in UFW
  ufw:
    rule: allow
    proto: udp
    port: "{{ wireguard_port }}"

- name: Allow DNS UDP from WireGuard subnet in UFW
  ufw:
    rule: allow
    proto: udp
    port: "53"
    from_ip: "{{ wireguard_network_cidr }}"

- name: Allow DNS TCP from WireGuard subnet in UFW
  ufw:
    rule: allow
    proto: tcp
    port: "53"
    from_ip: "{{ wireguard_network_cidr }}"

- name: Ensure WireGuard service is enabled and started
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Render dnsmasq config for WireGuard local DNS
  ansible.builtin.template:
    src: dnsmasq-wireguard.conf.j2
    dest: /etc/dnsmasq.d/wireguard-localdns.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq

- name: Validate dnsmasq configuration
  ansible.builtin.command: dnsmasq --test
  changed_when: false

- name: Ensure dnsmasq service is enabled and started
  ansible.builtin.systemd:
    name: "{{ wireguard_dns_service_name }}"
    state: started
    enabled: true

- name: Apply pending restarts before verification
  ansible.builtin.meta: flush_handlers

- name: Verify WireGuard interface is up
  ansible.builtin.command: "wg show {{ wireguard_interface }}"
  register: wireguard_status
  changed_when: false

- name: Verify local DNS wildcard resolves over WireGuard IP
  ansible.builtin.command: "dig +short @{{ wireguard_server_vpn_ip }} argocd.{{ wireguard_domain }}"
  register: wireguard_dns_probe
  changed_when: false

- name: Display WireGuard status
  ansible.builtin.debug:
    msg:
      - "{{ wireguard_status.stdout }}"
      - "DNS response for argocd.{{ wireguard_domain }}: {{ wireguard_dns_probe.stdout | default('') }}"
