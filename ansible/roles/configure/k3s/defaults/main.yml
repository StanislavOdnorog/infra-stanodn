---
k3s_admin_user: belle
k3s_server_role: server
k3s_kubeconfig_server: "{{ ansible_host | default(ansible_default_ipv4.address) }}"
k3s_write_kubeconfig_mode: "0600"
k3s_disable_traefik: false
k3s_disable_servicelb: false
k3s_disabled_components: []
k3s_tls_sans:
  - "{{ ansible_host | default(inventory_hostname) }}"
  - "{{ inventory_hostname }}"
k3s_node_labels: []
k3s_extra_server_args: []
k3s_install_env: {}
